# Builds llamatop and publishes a GitHub release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Tests run natively on Linux amd64, Linux arm64 and macOS (Apple Silicon);
# the binaries are cross-compiled on Linux. More platforms: add entries to
# the build matrix (and a runner to the test matrix if one exists).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin # macOS, Intel
            goarch: amd64
          - goos: darwin # macOS, Apple Silicon
            goarch: arm64
    env:
      NAME: llamatop-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0" # static binary, runs on any distribution
        run: |
          mkdir -p "dist/$NAME"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$NAME/llamatop" .
          cp README.md llamatop.example.toml "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "llamatop $GITHUB_REF_NAME" \
            --generate-notes
